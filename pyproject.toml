[project]
name = "multimodal-page-rag"
version = "0.1.0"
description = "Page-level multimodal RAG with late fusion, on SQLite + sqlite-vec"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlite-vec>=0.1.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]              # real text embeddings (and CLIP, with `images`)
images = ["pypdfium2>=4.30", "pillow>=10", "sentence-transformers>=3.0"]  # render pages + CLIP image embeddings
dev = ["pytest>=8"]

[project.scripts]
mmrag = "mmrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
